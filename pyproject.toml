[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "chem-dcat-ap"
description = "An extension of the DCAT Application Profile extended to provide chemistry specific specific metadata for datasets."
authors = [
  {name = "David Linke", email = "david.linke@catalysis.de"},
  {name = "Philip Strömert", email = "philip.stroemert@tib.eu"},
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README_pypkg.md"
requires-python = ">=3.11,<4.0"
dynamic = ["version"]

dependencies = [
  "linkml-runtime >=1.12.1",
]

[dependency-groups]
dev = [
    "linkml>=1.12.1",
    "mike>=2.1.3",
    "mkdocs-material>=9.7.7",
    "mkdocs-mermaid2-plugin>=1.1.1",
    "jupyter>=1.0.0",
    "mknotebooks>= 0.8.0",
    "pytest>=9.0.3",
    "coverage>=7.8.0",
]

# See https://hatch.pypa.io/latest/config/build/#file-selection for how to
# explicitly include files other than default into the build distributions.

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Setup injection of the version specifier into the schema file
# Ref.: https://hatch.pypa.io/latest/plugins/build-hook/version/#pyprojecttoml
# Backslashes in the regex pattern must be escaped for TOML.
[tool.hatch.build.hooks.version]
path = "src/chem_dcat_ap/schema/chem_dcat_ap.yaml"
pattern = """^(?:version:?\\s*\\")(?P<version>\\S*)(?:\\"\\s*# Managed by dynamic-versioning.).*$"""

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.pytest.ini_options]
testpaths = ["tests"]

# https://coverage.readthedocs.io/en/latest/config.html
[tool.coverage.paths]
# Specify where coverage schould look for source files.
source = [
    "src",
    # "**/site-packages", # for not using tox
    # ".tox/**/site-packages",
]

[tool.coverage.report]
# Show in report which lines are not covered
show_missing = false
# Any line of the source code that matches one of these regexes is excluded
# from being reported as missing.
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",
    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    "return NotImplemented",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
# Directory where to write the HTML report files.
directory = ".htmlcov"

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
  "src/dcat_4c_ap/datamodel/chem_dcat_ap_pydantic.py",
  "src/dcat_4c_ap/datamodel/chem_dcat_ap.py",
]

# Reminder: words have to be lowercased for the ignore-words-list
ignore-words-list = "linke"
quiet-level = 3

# Ref.: https://github.com/crate-ci/typos (spell checker)
[tool.typos.default.extend-words]
linke = "linke"
[tool.typos.files]
extend-exclude = [
  "LICENSE",
  "uv.lock",
  "pyproject.toml",
  "project/*",
  "src/dcat_4c_ap/datamodel/chem_dcat_ap_pydantic.py",
  "src/dcat_4c_ap/datamodel/chem_dcat_ap.py",
]

[tool.uv]
# Every patched soupsieve release (>=2.8.4, pulled in by beautifulsoup4 via
# nbconvert / mkdocs-mermaid2-plugin) requires Python >=3.11.5. Without this,
# uv forks the lock and falls back to beautifulsoup4 4.6.3 (2018) on
# 3.11.0-3.11.4. This only narrows the dev lockfile.
environments = ["python_full_version >= '3.11.5'"]
constraint-dependencies = [
    # GitPython security fixes
    "GitPython>=3.2.1",

    # Jupyter security fixes
    "jupyter-server>=2.21.1",
    "jupyterlab>=4.6.6",
    "notebook>=7.6.5",
    "nbconvert>=7.17.2",

    # HTTP and TLS security fixes
    "urllib3>=2.8.0",
    "anyio>=4.16.0",
    "certifi>=2026.11.20",

    # Parser and web server security fixes
    "mistune>=3.4.0",
    "tornado>=6.6.1",

    # HTML/CSS parsing and sanitising (via beautifulsoup4 / nbconvert)
    "soupsieve>=4.0.0",
    "bleach>=6.4.0",

    # Docs toolchain (via mkdocs-material / mkdocs-mermaid2-plugin)
    "pymdown-extensions>=11.0.1",
    "pygments>=2.20.0",
    "setuptools>=84.1.0",

    # HTTP stack
    "requests>=2.33.0",
    "idna>=3.15",
]
